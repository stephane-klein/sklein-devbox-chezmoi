[settings]
lockfile = true

[tools]
starship = "1.26.0"
opencode = "1.18.32"

# https://github.com/Shlomob/ocmonitor-share
"pipx:opencode-monitor" = "1.0.4"

# The release pace of Oh-My-Pi is very high (https://github.com/can1357/oh-my-pi/releases), with several updates per day, so for now I prefer not to pin the version.
# I installed oh-my-pi purely to try it out — for now, OpenCode remains my daily driver.
"github:can1357/oh-my-pi" = "latest"

# The release pace of Pi.dev is very hight (https://github.com/earendil-works/pi/releases), with several update per day, so for now I prefer not to pin the versions.
# I installed Pi.dev purely to try it out — for now, OpenCode remains my daily driver.
"github:earendil-works/pi" = "latest"

ripgrep = "15.2.0"
fd = "10.5.0"
tmux = "3.7c"
jujutsu = "0.45.1"
jjui = "0.10.10"
node = "24.14.1"
uv = "latest"
go = "latest"
neovim = "0.12.5"
tree-sitter = "0.27.0"
usage = "6.10.0"
atuin = "18.22.0"
delta = "0.19.2"
rtk = "0.49.0"
github-cli = "2.101.0"
fnox = "1.35.3"

claude-code = "2.1.278"

# Forgejo CLI (fj) + extension Actions (fj-ex)
"forgejo:forgejo-contrib/forgejo-cli" = "0.6.0"
"github:JKamsker/forgejo-cli-ex" = "0.1.7"

zoxide = "0.10.0"
jq = "1.8.2"
yq = "4.53.6"
yazi = "26.9.1"
lsd = "1.2.0"
"pipx:copier" = "9.18.2"
"github:tassiovirginio/try-rs" = "1.7.11"
"github:11happy/cpx" = "0.1.4"
"github:mitsuhiko/minijinja" = "2.24.0"
"github:laulauland/jj-hunk" = "0.5.1"
"github:newren/git-filter-repo" = "2.47.0"
"github:dmmulroy/jj-starship" = {
  version = "0.7.4",
  postinstall = "chmod u+x ${MISE_TOOL_INSTALL_PATH}/jj-starship"
}

# Incus client
"github:lxc/incus" = { version = "6.23", bin = "incus" }

#"go:github.com/mitsuhiko/gh-issue-sync" = "main"
"go:github.com/mitsuhiko/gh-issue-sync/cmd/gh-issue-sync" = "main"


# Tooling for OpenCode
"npm:@upstash/context7-mcp" = "4.1.1"
"pipx:mcp-server-fetch" = "2026.8.18"
"npm:tavily-mcp" = "0.2.22"
"npm:exa-mcp-server" = "3.4.1"
"npm:cc-safety-net" = "2.4.5"
"npm:@playwright/mcp" = "0.0.82"
"npm:@openchamber/web" = "1.24.2"

# Tooling for Tmux
"pipx:petname" = "latest"

# Kubernetes
kubectl = "1.37.0"
helm = "4.3.0"
kubectx = "0.11.0"
kubens = "0.11.0"
helmfile = "1.8.0"
k9s = "0.51.0"
